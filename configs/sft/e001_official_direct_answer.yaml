    You solve math problems. End your response with the final answer as an integer.
  user_template: |-
    {question}

    Solve the problem and end with: Final answer: <integer>

target:
  format_version: direct_integer_v001
  loss_mask_version: assistant_only_v001
  supervise_eos: true

training:
  method: qlora
  max_seq_length: 1152
  truncation_policy: error
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  effective_batch_size: 16
  num_train_epochs: 1
  expected_steps_per_epoch: 921
  expected_total_optimizer_steps: 921
  learning_rate: 0.0002
  optimizer: paged_adamw_8bit
  weight_decay: 0.0
  warmup_ratio: 0.03
  expected_warmup_steps: 28
  lr_scheduler_type: cosine
  max_grad_norm: 0.3
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: steps
  save_steps: 250
  save_total_limit: 1
  fp16: true
  bf16: false
  dataloader_num_workers: 0
  seed: 2026
  data_seed: 2026

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  task_type: CAUSAL_LM

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true

generation:
  version: greedy_v001
  do_sample: false
  num_beams: 1
  max_new_tokens: 1024
  use_cache: true

parser:
  version: integer_v001

output:
  adapter_directory: adapter
  training_metrics_filename: training_metrics.json
  telemetry_filename: training_log.jsonl
  identity_filename: training_identity.json
  predictions_filename: predictions.csv
  failures_filename: failures.csv
  metrics_filename: metrics.json
  resume_identity_filename: resume_identity.json
  comparison_filename: comparison_e000.json

provenance:
  require_clean_git_for_full_run: true
