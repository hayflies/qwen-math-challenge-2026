[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-math-challenge"
version = "0.1.0"
description = "Reproducible experiment infrastructure for the 2026 Qwen math challenge"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.2.1,<2",
    "bitsandbytes>=0.50.1,<0.51",
    "numpy>=1.26.4,<3",
    "peft>=0.20.0,<0.21",
    "PyYAML>=6.0.2,<7",
    "torch>=2.5.1,<3",
    "transformers>=4.46.3,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10",
    "ruff>=0.9.10,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
