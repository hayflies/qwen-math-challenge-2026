[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-math-challenge"
version = "0.1.0"
description = "Reproducible experiment infrastructure for the 2026 Qwen math challenge"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.4,<3",
    "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10",
    "ruff>=0.9.10,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
